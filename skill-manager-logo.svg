<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff9d"/>
      <stop offset="100%" style="stop-color:#00cfff"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff9d;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#00cfff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#00ff9d;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundedClip">
      <rect width="720" height="200" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" rx="16" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" clip-path="url(#roundedClip)">
    <line x1="0" y1="40" x2="720" y2="40" stroke="#00ff9d" stroke-width="1"/>
    <line x1="0" y1="80" x2="720" y2="80" stroke="#00ff9d" stroke-width="1"/>
    <line x1="0" y1="120" x2="720" y2="120" stroke="#00ff9d" stroke-width="1"/>
    <line x1="0" y1="160" x2="720" y2="160" stroke="#00ff9d" stroke-width="1"/>
    <line x1="90" y1="0" x2="90" y2="200" stroke="#00ff9d" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="200" stroke="#00ff9d" stroke-width="1"/>
    <line x1="270" y1="0" x2="270" y2="200" stroke="#00ff9d" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="200" stroke="#00ff9d" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="200" stroke="#00ff9d" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="200" stroke="#00ff9d" stroke-width="1"/>
    <line x1="630" y1="0" x2="630" y2="200" stroke="#00ff9d" stroke-width="1"/>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="718" height="198" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Terminal icon block -->
  <rect x="36" y="64" width="96" height="74" rx="10" fill="#0a0a0a" stroke="#1a2a1a" stroke-width="1.5"/>
  <!-- Traffic lights -->
  <circle cx="52" cy="80" r="5" fill="#ff5f56"/>
  <circle cx="68" cy="80" r="5" fill="#ffbd2e"/>
  <circle cx="84" cy="80" r="5" fill="#27c93f"/>
  <!-- Terminal prompt line 1 -->
  <text x="46" y="103" font-family="monospace" font-size="11" fill="#00ff9d" filter="url(#glow)" opacity="0.9">$ /list</text>
  <!-- Terminal prompt line 2 -->
  <text x="46" y="118" font-family="monospace" font-size="11" fill="#00cfff" opacity="0.7">$ /add</text>
  <!-- Terminal cursor blink -->
  <rect x="46" y="123" width="7" height="10" rx="1" fill="#00ff9d" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Main title -->
  <text x="158" y="90" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="url(#termGrad)" filter="url(#softGlow)" letter-spacing="-1">skill-manager</text>

  <!-- Subtitle -->
  <text x="160" y="118" font-family="'Courier New', monospace" font-size="14" fill="#4ade80" opacity="0.75" letter-spacing="1">Claude Skills CLI — /list · /add · /edit · /save · /delete</text>

  <!-- Bottom tagline -->
  <text x="160" y="150" font-family="'Courier New', monospace" font-size="11" fill="#6b7280" letter-spacing="0.5">manage your Claude skillset without leaving the chat</text>

  <!-- Decorative right accent -->
  <line x1="684" y1="30" x2="684" y2="170" stroke="#00ff9d" stroke-width="1" opacity="0.15"/>
  <circle cx="684" cy="100" r="18" fill="none" stroke="url(#termGrad)" stroke-width="1" opacity="0.3"/>
  <text x="684" y="105" font-family="monospace" font-size="14" fill="url(#termGrad)" text-anchor="middle" opacity="0.6" filter="url(#glow)">⌘</text>
</svg>
